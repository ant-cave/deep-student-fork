# 推送时自动构建无签名 APK + EXE
# 参考了 deep-student 的 rebuild-android / release 工作流，
# 但去掉了签名、发布到 Release、上传 R2 等环节，只留「编译→归档」。
#
# TODO: 等稳定下来再考虑要不要加缓存，目前每次都全量编译也挺费时间的…

name: Build Unsigned Artifacts

on:
  push:
    branches: [main]
  # 给个手动触发入口，省得每次都得推代码
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Android 无签名 APK ────────────────────────────
  build-android:
    name: Android (unsigned APK)
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7

      # 先腾点磁盘空间，Android SDK + NDK 是真吃容量
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK & NDK
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            "ndk;27.0.12077973" "build-tools;35.0.0" "platforms;android-35" | tail -3
          echo "NDK_HOME=${ANDROID_HOME}/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate version info
        run: node scripts/generate-version.mjs

      - name: Initialize Android project
        run: npx tauri android init

      - name: Configure NDK toolchain
        run: |
          NDK_PREBUILT="${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64"
          sed -i '/\[target.aarch64-linux-android\]/,/^$/{ s|linker = .*|linker = "'"${NDK_PREBUILT}"'/bin/aarch64-linux-android21-clang"|; s|ar = .*|ar = "'"${NDK_PREBUILT}"'/bin/llvm-ar"| }' src-tauri/.cargo/config.toml
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${NDK_PREBUILT}/bin/aarch64-linux-android21-clang" >> $GITHUB_ENV

      # 注：没配签名，直接输出 -unsigned.apk——用户说了不要签名
      - name: Build Android APK (unsigned)
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        # 给个 2.5h 超时，Android 编译是真的慢（尤其第一次）
        run: |
          timeout --signal=TERM --kill-after=60s 150m npx tauri android build --target aarch64

      - name: Upload unsigned APK as artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-arm64-unsigned
          path: src-tauri/gen/android/**/*-unsigned.apk
          if-no-files-found: error

  # ── Windows 无签名 EXE ───────────────────────────
  build-windows:
    name: Windows (unsigned EXE)
    runs-on: windows-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate version info
        run: node scripts/generate-version.mjs

      # 默认 tauri build 会打出 MSI，但用户要的是 exe，
      # 所以用 --bundles none 跳过 installer，只产原生 exe
      - name: Build Windows EXE (unsigned)
        env:
          # 不设签名证书，出来的 exe 就是无签名的
          SILICONFLOW_BUILTIN_TEXT_KEY: ${{ secrets.SILICONFLOW_BUILTIN_TEXT_KEY }}
          SILICONFLOW_BUILTIN_VISION_KEY: ${{ secrets.SILICONFLOW_BUILTIN_VISION_KEY }}
          SILICONFLOW_BUILTIN_EMBED_KEY: ${{ secrets.SILICONFLOW_BUILTIN_EMBED_KEY }}
        run: npx tauri build --bundles none

      - name: Upload unsigned EXE as artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64-unsigned
          # 拿编译出来的原生 exe，不拿 installer
          path: src-tauri/target/release/*.exe
          if-no-files-found: error

  # ── 发 Release ────────────────────────────────────
  # 谁成功了就发谁的制品，没编译出来的不硬等
  release:
    name: Create Release
    if: ${{ !cancelled() }}
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # 从 commit 里提取日期和 hash
      # sync.py 提交的信息格式：
      #   sync: main@2026-07-04
      #   (空行)
      #   源提交: abc1234
      #   原 commit 标题
      - name: Extract source commit info
        id: info
        run: |
          SUBJECT=$(git log -1 --format="%s")
          BODY=$(git log -1 --format="%b")
          RELEASE_DATE=$(echo "$SUBJECT" | sed -n 's/.*@\([0-9-]*\).*/\1/p')
          RELEASE_HASH=$(echo "$BODY" | sed -n 's/源提交: \([a-f0-9]*\)/\1/p')
          if [ -z "$RELEASE_DATE" ] || [ -z "$RELEASE_HASH" ]; then
            echo "::error::无法从 commit 中解析源提交信息"
            echo "subject: $SUBJECT"
            echo "body: $BODY"
            exit 1
          fi
          echo "date=${RELEASE_DATE}" >> "$GITHUB_OUTPUT"
          echo "hash=${RELEASE_HASH}" >> "$GITHUB_OUTPUT"

      # 谁成功就下载谁，失败的那个 artifact 不存在也无所谓
      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          name: android-arm64-unsigned
          path: release-artifacts
        continue-on-error: true

      - name: Download EXE artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-x86_64-unsigned
          path: release-artifacts
        continue-on-error: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.info.outputs.date }}-${{ steps.info.outputs.hash }}"

          # 至少得有一个制品才发 release
          ARTIFACT_COUNT=$(find release-artifacts -type f 2>/dev/null | wc -l | tr -d ' ')
          if [ "$ARTIFACT_COUNT" -eq 0 ]; then
            echo "::error::两个编译都失败了，没有制品可发"
            exit 1
          fi

          echo "创建 release: ${TAG}（共 ${ARTIFACT_COUNT} 个制品）"
          ls -lh release-artifacts/
          # --clobber 应对 tag 已存在的极端情况
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --generate-notes \
            release-artifacts/* \
            --clobber
